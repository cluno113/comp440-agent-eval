<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluation results</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; }
  label { margin-right: 32px; font-weight: 600; }
  .problems { border-left: 3px solid #d03b3b; padding-left: 12px; }
  table { border-collapse: collapse; margin-top: 16px; }
  th, td { padding: 6px 12px; border-bottom: 1px solid #8884; text-align: right; }
  th { vertical-align: bottom; max-width: 150px; }
  th.sortable, tbody tr.conversation { cursor: pointer; }
  tbody tr.conversation:hover { background: #8882; }
  .start { border-left: 2px solid #8888; }      /* first column of each student's scores */
  .average td { font-weight: 600; }
  .details { display: grid; grid-template-columns: 3fr 2fr; gap: 32px; }
  .reason { color: GrayText; margin: 0 0 12px; }
  #page { overflow-x: auto; }
</style>
</head>
<body>
<h1>Evaluation results</h1>
<p>Choose the <code>results.json</code> file your script wrote. To compare with a classmate, choose their
  file as Results B. The files stay on your computer.</p>
<p>
  <label>Results A <input type="file" id="fileA" accept=".json"></label>
  <label>Results B (optional) <input type="file" id="fileB" accept=".json"></label>
</p>
<div id="problems"></div>
<div id="page"></div>

<!-- The 100 conversations. A page opened from disk cannot read a .json file, so they are also kept as a .js file. -->
<script src="data/conversations.js"></script>
<script>
"use strict";

const conversations = new Map((window.CONVERSATIONS || []).map(c => [c.id, c]));
const files = { A: null, B: null };   // the result files that are loaded and valid
let sort = null;                      // which column the list is sorted by: { column, descending }

// Make an element. The content is either text or a list of child elements.
function el(tag, content = "", attributes = {}) {
  const node = document.createElement(tag);
  if (Array.isArray(content)) node.append(...content); else node.textContent = content;
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  return node;
}
const average = numbers => numbers.reduce((a, b) => a + b, 0) / numbers.length;

// ---------- Checking a file against the results format ----------

// Returns a list of problems in plain words. An empty list means the file is valid.
function check(data) {
  if (!data || typeof data.author !== "string" || !Array.isArray(data.results) || !data.results.length) {
    return ['The file must look like {"author": "your name", "results": [ ... ]} with at least one result.'];
  }
  const problems = [];
  const names = r => Array.isArray(r.scores) ? r.scores.map(s => s && s.criterion).join(" | ") : "";
  const seen = new Set();
  data.results.forEach((r, i) => {
    const where = `results[${i}]: `;
    if (!r || !Number.isInteger(r.conversation_id)) return problems.push(where + '"conversation_id" must be a whole number.');
    if (seen.has(r.conversation_id)) problems.push(where + `conversation ${r.conversation_id} appears more than once.`);
    seen.add(r.conversation_id);
    if (conversations.size && !conversations.has(r.conversation_id)) problems.push(where + `there is no conversation ${r.conversation_id}.`);
    if (!Array.isArray(r.scores) || !r.scores.length) return problems.push(where + '"scores" must be a list with one entry for each criterion.');
    const valid = r.scores.every(s => s && typeof s.criterion === "string" && typeof s.reason === "string"
      && Number.isInteger(s.score) && s.score >= 1 && s.score <= 5);
    if (!valid) return problems.push(where + 'each entry in "scores" needs a "criterion" (text), a "score" (a whole number from 1 to 5) and a "reason" (text).');
    if (names(r) !== names(data.results[0])) problems.push(where + "the criteria must be the same, in the same order, as in the first result.");
    const expected = average(r.scores.map(s => s.score));
    if (typeof r.overall !== "number" || Math.abs(r.overall - expected) > 0.011) problems.push(where + `"overall" must be the average of the scores, ${expected.toFixed(2)}.`);
  });
  return problems;
}

async function load(slot, file) {
  files[slot] = null;
  let problems = [];
  if (file) {
    try {
      const data = JSON.parse(await file.text());
      problems = check(data);
      if (!problems.length) files[slot] = data;
    } catch (error) {
      problems = ["The file is not valid JSON: " + error.message];
    }
  }
  const box = document.getElementById("problems");
  box.replaceChildren();
  if (problems.length) {
    const more = problems.length > 10 ? [`... and ${problems.length - 10} more.`] : [];
    box.append(el("div", [
      el("p", `Results ${slot} does not match the results format:`),
      el("ul", [...problems.slice(0, 10), ...more].map(p => el("li", p))),
    ], { class: "problems" }));
  }
  sort = null;
  location.hash = "";
  show();
}
document.getElementById("fileA").addEventListener("change", event => load("A", event.target.files[0]));
document.getElementById("fileB").addEventListener("change", event => load("B", event.target.files[0]));
window.addEventListener("hashchange", show);

// ---------- The two pages ----------

// One row per conversation, holding that conversation's result from each loaded file.
function rows() {
  const byId = new Map();
  for (const slot of ["A", "B"]) {
    for (const result of files[slot]?.results || []) {
      if (!byId.has(result.conversation_id)) byId.set(result.conversation_id, { id: result.conversation_id });
      byId.get(result.conversation_id)[slot] = result;
    }
  }
  return [...byId.values()];
}

function show() {
  const page = document.getElementById("page");
  const row = rows().find(r => String(r.id) === location.hash.slice(1));
  page.replaceChildren(...(row ? detailsPage(row) : listPage()));
  if (row) window.scrollTo(0, 0);
}

// The list: every conversation with its score on each criterion and its overall score.
function listPage() {
  const slots = ["A", "B"].filter(slot => files[slot]);
  if (!slots.length) return [];

  // The columns of the table. "value" gets a column's number out of a row.
  const columns = [{ label: "Conversation", value: row => row.id }];
  for (const slot of slots) {
    files[slot].results[0].scores.forEach((s, i) =>
      columns.push({ label: s.criterion, start: i === 0, value: row => row[slot]?.scores[i].score }));
    columns.push({ label: "Overall", decimals: true, value: row => row[slot]?.overall });
  }
  if (slots.length === 2) {
    columns.push({ label: "Gap", start: true, decimals: true,
      value: row => row.A && row.B ? Math.abs(row.A.overall - row.B.overall) : undefined });
  }

  // Sorted by conversation number, or by the largest gap first when two files are loaded.
  sort ??= slots.length === 2 ? { column: columns.length - 1, descending: true } : { column: 0, descending: false };
  const key = columns[sort.column].value;
  const list = rows().sort((p, q) => ((key(p) ?? -1) - (key(q) ?? -1)) * (sort.descending ? -1 : 1) || p.id - q.id);

  const format = (column, number) => number === undefined ? "" : column.decimals ? number.toFixed(2) : String(number);
  const cell = (tag, column, text) => el(tag, text, column.start ? { class: "start" } : {});

  const authors = el("tr", [el("th"), ...slots.map(slot =>
    el("th", files[slot].author, { colspan: files[slot].results[0].scores.length + 1, class: "start" }))]);
  const headers = el("tr", columns.map((column, i) => {
    const th = cell("th", column, column.label + (i === sort.column ? (sort.descending ? " ▼" : " ▲") : ""));
    th.classList.add("sortable");
    th.onclick = () => { sort = { column: i, descending: i === sort.column && !sort.descending }; show(); };
    return th;
  }));
  const averages = el("tr", columns.map((column, i) => {
    const numbers = list.map(column.value).filter(n => n !== undefined);
    return cell("td", column, i === 0 ? "Average" : numbers.length ? average(numbers).toFixed(2) : "");
  }), { class: "average" });
  const body = list.map(row => {
    const tr = el("tr", columns.map(column => cell("td", column, format(column, column.value(row)))), { class: "conversation" });
    tr.onclick = () => { location.hash = row.id; };
    return tr;
  });

  return [
    el("p", "Click a row to read that conversation and the reasons for its scores. Click a column heading to sort."),
    el("table", [el("thead", [authors, headers]), el("tbody", [averages, ...body])]),
  ];
}

// The details for one conversation: its text, and each judge's scores and reasons.
function detailsPage(row) {
  const conversation = conversations.get(row.id);
  const turns = conversation
    ? conversation.conversation.split("\n\n").map(turn => el("p", turn))
    : [el("p", "The conversation text was not found. Open viewer.html from inside the repository folder.")];
  const judges = ["A", "B"].filter(slot => row[slot]).flatMap(slot => [
    el("h3", `${files[slot].author}: overall ${row[slot].overall.toFixed(2)}`),
    ...row[slot].scores.flatMap(s => [
      el("strong", `${s.score} of 5: ${s.criterion}`),
      el("p", s.reason || "The judge gave no reason.", { class: "reason" }),
    ]),
  ]);
  return [
    el("p", [el("a", "Back to the list", { href: "#" })]),
    el("h2", `Conversation ${row.id}`),
    el("div", [el("div", turns), el("div", judges)], { class: "details" }),
  ];
}
</script>
</body>
</html>
